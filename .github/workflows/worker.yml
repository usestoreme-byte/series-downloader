name: Manual Series Ingestion Worker

on:
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 mediainfo curl

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Execute Series Ingestion Engine
      env:
        GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        VIDARA_API_KEY: ${{ secrets.VIDARA_API_KEY }}
        ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || vars.SPREADSHEET_ID || '11VbSz90oR87pDAqxDY-Zyrg4NNM3LgPxKynjqlzIueM' }}
        # --- NEW TELEGRAM CONFIGURATION ENV MAPPINGS ---
        TG_API_ID: ${{ secrets.TG_API_ID }}
        TG_API_HASH: ${{ secrets.TG_API_HASH }}
        TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      run: python series_worker.py
