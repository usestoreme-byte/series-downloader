name: Series Downloader
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    container: ghcr.io/filmycinemaa-maker/seriesv1split/beam-runner:latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Series Downloader
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          VIDARA_API_KEY: ${{ secrets.VIDARA_API_KEY }}
          BEAM_ADMIN_EMAIL: ${{ secrets.BEAM_ADMIN_EMAIL }}
          BEAM_ADMIN_PASSWORD: ${{ secrets.BEAM_ADMIN_PASSWORD }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python series-downloader.py
